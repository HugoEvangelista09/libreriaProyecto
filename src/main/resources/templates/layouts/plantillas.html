<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
	<head th:fragment="cabecera">
		<meta charset="UTF-8">
		<title>Insert title here</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	</head>
	
	<nav th:fragment="barraNavegacion" class="navbar navbar-expand-lg bg-body-tertiary"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  		<div class="container-fluid">
    		<a class="navbar-brand" href="#">Libreria</a>
    		<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            	data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            	aria-expanded="false" aria-label="Toggle navigation">
      			<span class="navbar-toggler-icon"></span>
    		</button>
    		<div class="collapse navbar-collapse" id="navbarSupportedContent">
      			<ul class="navbar-nav me-auto mb-2 mb-lg-0">

        				<!-- Visible para todos los autenticados -->
        				<li class="nav-item">
          					<a class="nav-link active" aria-current="page" th:href="@{/}">Inicio</a>
        				</li>

        				<!-- ADMIN y VENDEDOR -->
        				<li class="nav-item" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
          					<a class="nav-link" th:href="@{/libros}">Registrar Libro</a>
        				</li>
        				<li class="nav-item" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
          					<a class="nav-link" th:href="@{/clientes}">Registrar Cliente</a>
        				</li>
        				<li class="nav-item" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
          					<a class="nav-link" th:href="@{/ventas}">Registrar Venta</a>
        				</li>

				        <!-- Solo ADMIN -->
				        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
				        	<a class="nav-link" th:href="@{/reportes}">Reportes</a>
				        </li>
				        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
				        	<a class="nav-link" th:href="@{/inventario}">Control de Inventario</a>
				        </li>

      				</ul>
    		</div>
  		</div>
	</nav>
	
	<footer th:fragment="pie">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	</footer>
