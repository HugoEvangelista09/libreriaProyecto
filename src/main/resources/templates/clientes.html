<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<th:block th:replace="~{layouts/plantillas :: barraNavegacion}"></th:block>

<div class="container mt-4">

    <!-- TITULO -->
    <div class="text-center mb-4">
        <h2 class="fw-bold">Gestión de Clientes</h2>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow mb-5">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Registrar Cliente</h5>
        </div>

        <div class="card-body">
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

				 <input type="hidden" th:field="*{idCliente}">
                <div class="row g-3">

                    <!-- Nombre -->
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre del cliente" required>
                    </div>

                    <!-- Apellido -->
                    <div class="col-md-6">
                        <label class="form-label">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control" placeholder="Apellido" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="correo@gmail.com">
                    </div>

                    <!-- Teléfono -->
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="0999999999">
                    </div>

                    <!-- Dirección -->
                    <div class="col-12">
                        <label class="form-label">Dirección</label>
                        <input type="text" th:field="*{direccion}" class="form-control" placeholder="Dirección del cliente">
                    </div>

                    <!-- BOTON -->
                    <div class="col-12 d-grid mt-3">
                        <button type="submit" class="btn btn-success btn-lg"
        th:text="${cliente.idCliente} != null ? 'Actualizar Cliente' : 'Registrar Cliente'">
</button>
                    </div>

                </div>

            </form>
        </div>
    </div>

    <!-- TABLA -->
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Clientes Registrados</h5>
        </div>

        <div class="card-body">
            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="c : ${lista}">
                            <td th:text="${c.idCliente}"></td>
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.apellido}"></td>
                            <td th:text="${c.email}"></td>
                            <td th:text="${c.telefono}"></td>
                            <td th:text="${c.direccion}"></td>

                            <td>
                                <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}" 
   								class="btn btn-warning btn-sm">Editar</a>

								<a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}" 
   								class="btn btn-danger btn-sm">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </div>
    </div>

</div>

</body>
</html>
